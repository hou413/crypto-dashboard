<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>DNF 看板 - 调试版</title>
    <style>
        body { background: #0a0e17; color: #e0e6ed; font-family: monospace; padding: 20px; }
        .debug { background: #1a2235; padding: 15px; margin: 10px 0; border-radius: 8px; }
        .error { color: #ff4757; }
        .success { color: #00ff88; }
        .info { color: #00d4ff; }
        pre { background: #0f1520; padding: 10px; overflow: auto; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>🔧 DNF 看板调试</h1>
    
    <div class="debug">
        <h3>1. 数据加载状态</h3>
        <div id="loadStatus">加载中...</div>
    </div>
    
    <div class="debug">
        <h3>2. 历史数据</h3>
        <div id="historyData">-</div>
    </div>
    
    <div class="debug">
        <h3>3. 当前状态</h3>
        <div id="currentStatus">-</div>
    </div>
    
    <div class="debug">
        <h3>4. 数据处理</h3>
        <div id="processedData">-</div>
    </div>

    <script>
        async function testLoad() {
            const statusEl = document.getElementById('loadStatus');
            const historyEl = document.getElementById('historyData');
            const currentEl = document.getElementById('currentStatus');
            const processedEl = document.getElementById('processedData');
            
            try {
                // 加载历史数据
                console.log('加载 signal_history.json...');
                const r1 = await fetch('data/signal_history.json?t=' + Date.now());
                console.log('响应:', r1.status, r1.ok);
                
                if (!r1.ok) throw new Error('历史数据加载失败: ' + r1.status);
                
                const history = await r1.json();
                console.log('历史数据:', history);
                
                statusEl.innerHTML = '<span class="success">✅ 历史数据加载成功</span>';
                historyEl.innerHTML = `<pre>${JSON.stringify(history.slice(-3), null, 2)}</pre>`;
                
                // 加载当前状态
                console.log('加载 mean_reversion_signals.json...');
                const r2 = await fetch('data/mean_reversion_signals.json?t=' + Date.now());
                console.log('响应:', r2.status, r2.ok);
                
                if (!r2.ok) throw new Error('状态数据加载失败: ' + r2.status);
                
                const current = await r2.json();
                console.log('当前状态:', current);
                
                statusEl.innerHTML += '<br><span class="success">✅ 状态数据加载成功</span>';
                currentEl.innerHTML = `<pre>${JSON.stringify(current, null, 2)}</pre>`;
                
                // 处理数据
                const periods = ['5M', '1H', '4H'];
                let processed = {};
                
                periods.forEach(p => {
                    const records = [];
                    history.forEach(entry => {
                        const rec = (entry.records || {})[p];
                        if (rec) {
                            records.push({
                                time: entry.timestamp,
                                epoch: entry.epoch,
                                period: p,
                                signal: rec.signal,
                                deviation: rec.deviation,
                                price: rec.price,
                                trend: rec.trend,
                                verified: rec.verified || false,
                                result: rec.result,
                            });
                        }
                    });
                    
                    const signals = records.filter(r => r.signal);
                    const verified = signals.filter(r => r.verified);
                    const wins = verified.filter(r => r.result).length;
                    
                    processed[p] = {
                        total: records.length,
                        signals: signals.length,
                        verified: verified.length,
                        wins: wins,
                        winRate: verified.length > 0 ? Math.round(wins / verified.length * 100) : 0,
                        latest: records.length > 0 ? records[records.length - 1] : null
                    };
                });
                
                console.log('处理后数据:', processed);
                processedEl.innerHTML = `<pre>${JSON.stringify(processed, null, 2)}</pre>`;
                
                // 显示总结
                let summary = '<h4>📊 数据总结</h4>';
                periods.forEach(p => {
                    const d = processed[p];
                    summary += `<p class="info">${p}: ${d.total}条记录, ${d.signals}个信号, 胜率${d.winRate}%</p>`;
                    if (d.latest) {
                        summary += `<p>最新: 偏离${d.latest.deviation?.toFixed(3)}%, 趋势${d.latest.trend}</p>`;
                    }
                });
                processedEl.innerHTML += summary;
                
            } catch(e) {
                console.error('错误:', e);
                statusEl.innerHTML = `<span class="error">❌ 错误: ${e.message}</span>`;
            }
        }
        
        testLoad();
    </script>
</body>
</html>

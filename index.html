<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNF + HBW Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0f1117; 
            color: #e5e7eb; 
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; 
            padding: 20px;
            min-height: 100vh;
        }
        
        /* Header */
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 24px; 
            padding: 16px 20px;
            background: linear-gradient(135deg, #1a1d29, #252836);
            border-radius: 16px;
            border: 1px solid #2d3148;
        }
        .header h1 { font-size: 28px; font-weight: 700; }
        .header h1 span { 
            background: linear-gradient(135deg, #6366f1, #a855f7); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        .header-right { text-align: right; }
        .price { font-size: 32px; font-weight: 700; color: #60a5fa; }
        .time { font-size: 14px; color: #6b7280; margin-top: 4px; }
        
        /* Grid */
        .grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
        }
        @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
        
        /* Period Card */
        .period-card { 
            background: #1a1d29;
            border: 1px solid #2d3148;
            border-radius: 20px; 
            padding: 20px;
        }
        .period-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #2d3148;
        }
        .period-title { 
            font-size: 24px; 
            font-weight: 700; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        .period-title.p4h { color: #818cf8; }
        .period-title.p1h { color: #fbbf24; }
        .badge { 
            font-size: 13px; 
            padding: 4px 10px; 
            border-radius: 8px; 
            font-weight: 500;
        }
        .badge-main { background: rgba(99,102,241,0.2); color: #818cf8; }
        .badge-ref { background: rgba(251,191,36,0.2); color: #fbbf24; }
        .round-time { 
            font-size: 15px; 
            color: #9ca3af; 
            background: #252836; 
            padding: 6px 12px; 
            border-radius: 10px; 
        }
        
        /* Strategy Section */
        .strategy { 
            margin-bottom: 16px;
            background: #252836;
            border: 1px solid #2d3148;
            border-radius: 14px; 
            padding: 16px;
        }
        .strategy:last-child { margin-bottom: 0; }
        .strategy-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 14px;
        }
        .strategy-name { 
            font-size: 16px; 
            font-weight: 600;
        }
        .strategy-name.dnf { color: #34d399; }
        .strategy-name.hbw { color: #a78bfa; }
        
        /* Signal Badge */
        .signal { 
            font-size: 18px; 
            font-weight: 700; 
            padding: 6px 14px; 
            border-radius: 10px; 
        }
        .signal-up { background: rgba(16,185,129,0.2); color: #34d399; }
        .signal-down { background: rgba(239,68,68,0.2); color: #f87171; }
        .signal-none { background: #374151; color: #6b7280; }
        .signal-blocked { background: rgba(251,191,36,0.2); color: #fbbf24; }
        
        /* Metrics Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .metric-box {
            background: #1a1d29;
            border: 1px solid #2d3148;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }
        .metric-label { 
            font-size: 11px; 
            color: #6b7280; 
            text-transform: uppercase;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }
        .metric-value { 
            font-size: 18px;
            font-weight: 700; 
            color: #f3f4f6;
        }
        .metric-value.positive { color: #34d399; }
        .metric-value.negative { color: #f87171; }
        
        /* HBW Section */
        .target-box {
            background: #1a1d29;
            border: 1px solid #2d3148;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .target-label { font-size: 14px; color: #9ca3af; }
        .target-value { font-size: 18px; font-weight: 700; color: #f3f4f6; }
        .target-dev { font-size: 14px; margin-left: 8px; }
        
        .prob-bar { 
            height: 32px; 
            background: #1a1d29; 
            border-radius: 10px; 
            overflow: hidden; 
            display: flex; 
            margin-bottom: 12px;
            border: 1px solid #2d3148;
        }
        .prob-up { 
            background: linear-gradient(90deg, #059669, #34d399); 
            height: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: #fff; 
            font-size: 14px; 
            font-weight: 700; 
        }
        .prob-down { 
            background: linear-gradient(90deg, #f87171, #dc2626); 
            height: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: #fff; 
            font-size: 14px; 
            font-weight: 700; 
        }
        
        .price-row {
            display: flex;
            justify-content: space-around;
            margin-bottom: 12px;
        }
        .price-item {
            text-align: center;
        }
        .price-item-label { font-size: 12px; color: #6b7280; }
        .price-item-value { font-size: 16px; font-weight: 600; color: #f3f4f6; }
        
        .progress-text { 
            color: #818cf8; 
            font-size: 16px; 
            font-weight: 600;
            text-align: center;
            padding: 8px;
            background: rgba(99,102,241,0.1);
            border-radius: 8px;
            margin-bottom: 12px;
        }
        
        .ev-box {
            background: #1a1d29;
            border: 1px solid #2d3148;
            border-radius: 10px;
            padding: 12px 16px;
            text-align: center;
        }
        .ev-positive { 
            color: #34d399; 
            font-weight: 700;
            font-size: 18px;
        }
        .ev-negative { 
            color: #6b7280; 
            font-size: 16px;
        }
        
        .loading { 
            text-align: center; 
            padding: 60px; 
            color: #6b7280; 
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>📊 <span>DNF + HBW</span></h1>
        </div>
        <div class="header-right">
            <div class="price" id="btc-price">--</div>
            <div class="time" id="update-time">加载中...</div>
        </div>
    </div>
    
    <div id="content" class="grid">
        <div class="loading">加载数据...</div>
    </div>
    
    <script>
    // ===== 配置 =====
    const MA_PERIODS = { '1H': 20, '4H': 20 };
    const THRESHOLDS = { '1H': 0.4, '4H': 1.5 };
    const EMA_PARAMS = {
        '1H': { fast: 20, slow: 50, threshold: 0.15 },
        '4H': { fast: 20, slow: 50, threshold: 0.30 }
    };
    const EMA_DYNAMIC = {
        '1H': { slope_low: 0.10, slope_high: 0.30, mult_normal: 1.0, mult_mid: 1.5, mult_high: 2.0 },
        '4H': { slope_low: 0.15, slope_high: 0.40, mult_normal: 1.0, mult_mid: 1.5, mult_high: 2.0 }
    };
    const BINANCE_API = 'https://api.binance.com';
    const POLYMARKET_API = 'https://gamma-api.polymarket.com';
    const MONTHS = ['','january','february','march','april','may','june','july','august','september','october','november','december'];
    
    // ===== Binance API =====
    async function fetchKlines(interval, limit = 100) {
        const url = `${BINANCE_API}/api/v3/klines?symbol=BTCUSDT&interval=${interval}&limit=${limit}`;
        const resp = await fetch(url);
        const data = await resp.json();
        return data.reverse().map(k => ({
            time: k[0],
            open: parseFloat(k[1]),
            high: parseFloat(k[2]),
            low: parseFloat(k[3]),
            close: parseFloat(k[4]),
            volume: parseFloat(k[5])
        }));
    }
    
    async function fetchCurrentPrice() {
        const resp = await fetch(`${BINANCE_API}/api/v3/ticker/price?symbol=BTCUSDT`);
        const data = await resp.json();
        return parseFloat(data.price);
    }
    
    async function fetchPriceAt(timestampMs) {
        const url = `${BINANCE_API}/api/v3/klines?symbol=BTCUSDT&interval=1m&startTime=${timestampMs}&limit=1`;
        const resp = await fetch(url);
        const data = await resp.json();
        if (data && data.length > 0) return parseFloat(data[0][4]);
        return null;
    }
    
    // ===== 技术指标 =====
    function calcMA(candles, period) {
        if (candles.length < period + 1) return null;
        let sum = 0;
        for (let i = 1; i <= period; i++) sum += candles[i].close;
        return sum / period;
    }
    
    function calcEMA(candles, period) {
        if (candles.length < period + 1) return null;
        const k = 2 / (period + 1);
        let ema = candles[candles.length - 1].close;
        for (let i = candles.length - 2; i >= 1; i--) {
            ema = candles[i].close * k + ema * (1 - k);
        }
        return ema;
    }
    
    function calcEMASeries(candles, period) {
        if (candles.length < period) return [];
        const k = 2 / (period + 1);
        let ema = candles[candles.length - 1].close;
        const series = [ema];
        for (let i = candles.length - 2; i >= 0; i--) {
            ema = candles[i].close * k + ema * (1 - k);
            series.push(ema);
        }
        return series.reverse();
    }
    
    function calcDeviation(price, ma) {
        return ((price - ma) / ma) * 100;
    }
    
    function calcEMASlope(candles, period) {
        const series = calcEMASeries(candles, period);
        if (series.length < 3) return 0;
        const current = series[0];
        const prev = series[2];
        return ((current - prev) / 3 / current) * 100;
    }
    
    function detectTrend(candles, period) {
        const params = EMA_PARAMS[period];
        if (!params) return { regime: 'RANGING', filter_passed: true };
        
        const emaFast = calcEMA(candles, params.fast);
        const emaSlow = calcEMA(candles, params.slow);
        if (!emaFast || !emaSlow) return { regime: 'RANGING', filter_passed: true };
        
        const currentPrice = candles[0].close;
        const distance = Math.abs(emaFast - emaSlow) / emaSlow * 100;
        
        let regime;
        if (distance < params.threshold) {
            regime = 'RANGING';
        } else if (emaFast > emaSlow && currentPrice > emaSlow) {
            regime = 'TRENDING_UP';
        } else if (emaFast < emaSlow && currentPrice < emaSlow) {
            regime = 'TRENDING_DOWN';
        } else {
            regime = 'RANGING';
        }
        
        return { regime, emaFast, emaSlow, distance };
    }
    
    function getDynamicThreshold(period, baseThreshold, candles) {
        const params = EMA_DYNAMIC[period];
        if (!params) return { threshold: baseThreshold, multiplier: 1.0, slope: 0 };
        
        const slope = Math.abs(calcEMASlope(candles, 20));
        
        let multiplier;
        if (slope < params.slope_low) multiplier = params.mult_normal;
        else if (slope < params.slope_high) multiplier = params.mult_mid;
        else multiplier = params.mult_high;
        
        return { threshold: baseThreshold * multiplier, multiplier, slope };
    }
    
    function calcProbability(deviation, timeFactor = 1.0) {
        const absDev = Math.abs(deviation);
        // 基础概率（仅基于偏离度）
        const baseProb = 0.5 + 0.45 * (1 - Math.exp(-3 * absDev));
        // 时间衰减：剩余时间越少，概率越向 0.5 收敛
        // timeFactor=1.0 时保持原概率，timeFactor=0 时回到 0.5
        const adjustedProb = 0.5 + (baseProb - 0.5) * timeFactor;
        return Math.min(0.95, Math.max(0.05, adjustedProb));
    }
    
    // 计算时间因子（基于剩余时间占比）
    function calcTimeFactor(eventStart, period) {
        if (!eventStart) return 1.0;
        try {
            const start = new Date(eventStart).getTime();
            const totalMinutes = period === '4H' ? 240 : 60;
            const end = start + totalMinutes * 60 * 1000;
            const now = Date.now();
            const remaining = end - now;
            const total = end - start;
            
            if (remaining <= 0) return 0.1; // 已结束，极低因子
            if (remaining >= total) return 1.0; // 刚开始，完整因子
            
            const remainingRatio = remaining / total;
            
            // 时间因子曲线：
            // 剩余 > 60%: factor = 1.0
            // 剩余 30-60%: factor = 0.8-1.0 (线性)
            // 剩余 10-30%: factor = 0.5-0.8 (线性)
            // 剩余 < 10%: factor = 0.2-0.5 (线性)
            let factor;
            if (remainingRatio > 0.6) {
                factor = 1.0;
            } else if (remainingRatio > 0.3) {
                factor = 0.8 + (remainingRatio - 0.3) / 0.3 * 0.2;
            } else if (remainingRatio > 0.1) {
                factor = 0.5 + (remainingRatio - 0.1) / 0.2 * 0.3;
            } else {
                factor = 0.2 + remainingRatio / 0.1 * 0.3;
            }
            
            return factor;
        } catch {
            return 1.0;
        }
    }
    
    // ===== DNF 分析 =====
    function analyzeDNF(candles, period, timeFactor = 1.0) {
        const ma = calcMA(candles, MA_PERIODS[period]);
        const ema = calcEMA(candles, 20);
        if (!ma || !ema) return null;
        
        const price = candles[0].close;
        const deviation = calcDeviation(price, ma);
        const trend = detectTrend(candles, period);
        const dynThreshold = getDynamicThreshold(period, THRESHOLDS[period], candles);
        const probability = calcProbability(deviation, timeFactor);
        
        let signal = deviation > 0 ? 'DOWN' : 'UP';
        let trendBlocked = false;
        let originalSignal = signal;
        
        if (signal === 'UP' && trend.regime === 'TRENDING_DOWN') trendBlocked = true;
        else if (signal === 'DOWN' && trend.regime === 'TRENDING_UP') trendBlocked = true;
        
        return {
            signal: trendBlocked ? null : signal,
            originalSignal,
            trendBlocked,
            deviation,
            ma,
            ema,
            price,
            probability,
            timeFactor,
            trend: trend.regime,
            emaSlope: calcEMASlope(candles, 20),
            dynamicThreshold: dynThreshold.threshold,
            thresholdMultiplier: dynThreshold.multiplier
        };
    }
    
    // ===== Polymarket =====
    function getPolymarketSlug(interval) {
        const now = new Date();
        const etOffset = -4 * 60;
        const utcOffset = now.getTimezoneOffset();
        const etNow = new Date(now.getTime() + (utcOffset + etOffset) * 60000);
        
        let tStart = new Date(etNow);
        const totalMin = tStart.getHours() * 60 + tStart.getMinutes();
        
        let alignedMin;
        if (interval === '1h') alignedMin = Math.floor(totalMin / 60) * 60;
        else if (interval === '4h') alignedMin = Math.floor(totalMin / 240) * 240;
        else alignedMin = Math.floor(totalMin / parseInt(interval)) * parseInt(interval);
        
        tStart = new Date(tStart.getFullYear(), tStart.getMonth(), tStart.getDate(), 
                         Math.floor(alignedMin / 60), alignedMin % 60, 0);
        
        if (interval === '1h') {
            let hour = tStart.getHours();
            let hourStr;
            if (hour === 0) hourStr = '12am';
            else if (hour < 12) hourStr = hour + 'am';
            else if (hour === 12) hourStr = '12pm';
            else hourStr = (hour - 12) + 'pm';
            return `bitcoin-up-or-down-${MONTHS[tStart.getMonth()+1]}-${tStart.getDate()}-${tStart.getFullYear()}-${hourStr}-et`;
        } else {
            const utcStart = new Date(tStart.getTime() - (utcOffset + etOffset) * 60000);
            const slugTs = Math.floor(utcStart.getTime() / 1000);
            return `btc-updown-${interval}-${slugTs}`;
        }
    }
    
    async function fetchPolymarketData(interval) {
        const slug = getPolymarketSlug(interval);
        try {
            const resp = await fetch(`${POLYMARKET_API}/events?slug=${slug}`);
            const data = await resp.json();
            if (!data || data.length === 0) return null;
            
            const event = data[0];
            const markets = event.markets || [];
            if (markets.length === 0) return null;
            
            const market = markets[0];
            const eventStart = market.eventStartTime || market.startDate;
            
            let upPrice = 0.5, downPrice = 0.5;
            const outcomes = market.outcomes || [];
            const prices = market.outcomePrices ? JSON.parse(market.outcomePrices) : [];
            
            for (let i = 0; i < outcomes.length; i++) {
                if (outcomes[i] === 'Up' || outcomes[i] === 'UP') upPrice = parseFloat(prices[i] || 0.5);
                else if (outcomes[i] === 'Down' || outcomes[i] === 'DOWN') downPrice = parseFloat(prices[i] || 0.5);
            }
            
            return { eventStart, slug, upPrice, downPrice, volume: market.volume || 0 };
        } catch (e) {
            console.error('Polymarket fetch error:', e);
            return null;
        }
    }
    
    async function getTargetPrice(eventStart) {
        if (!eventStart) return null;
        try {
            const startDt = new Date(eventStart);
            return await fetchPriceAt(startDt.getTime());
        } catch { return null; }
    }
    
    // ===== HBW 分析 =====
    function analyzeHBW(dnfResult, polyData, targetPrice) {
        if (!polyData || !targetPrice || !dnfResult) return null;
        
        const price = dnfResult.price;
        const targetDev = ((price - targetPrice) / targetPrice) * 100;
        
        let progress = null;
        if (polyData.eventStart) {
            const start = new Date(polyData.eventStart).getTime();
            const interval = polyData.slug.includes('4h') ? 4 * 60 : 60;
            const end = start + interval * 60 * 1000;
            const now = Date.now();
            const total = end - start;
            const elapsed = now - start;
            const remaining = end - now;
            if (remaining > 0 && elapsed > 0) {
                progress = { elapsedRatio: elapsed / total, remainingMin: remaining / 60000 };
            } else if (remaining <= 0) {
                progress = { elapsedRatio: 1, remainingMin: 0, ended: true };
            }
        }
        
        const pUp = polyData.upPrice;
        const pDown = polyData.downPrice;
        const betAmount = 45;
        
        const modelPUp = dnfResult.signal === 'UP' ? dnfResult.probability : (1 - dnfResult.probability);
        const modelPDown = 1 - modelPUp;
        
        const evUp = modelPUp * (1 / pUp - 1) - (1 - modelPUp);
        const evDown = modelPDown * (1 / pDown - 1) - (1 - modelPDown);
        
        let action = 'NO BET', ev = 0, positionUsd = 0;
        
        if (evUp > 0.05 && evUp > evDown) {
            action = 'BUY UP'; ev = evUp; positionUsd = betAmount;
        } else if (evDown > 0.05 && evDown > evUp) {
            action = 'BUY DOWN'; ev = evDown; positionUsd = betAmount;
        }
        
        return { targetPrice, targetDev, pUp, pDown, progress, action, ev, positionUsd, eventStart: polyData.eventStart };
    }
    
    // ===== 渲染 =====
    function formatRoundTime(eventStart, period) {
        if (!eventStart) return '';
        try {
            const start = new Date(eventStart);
            const hours = period === '4H' ? 4 : 1;
            const end = new Date(start.getTime() + hours * 60 * 60 * 1000);
            const startStr = start.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Shanghai' });
            const endStr = end.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Shanghai' });
            return `${startStr}-${endStr}`;
        } catch { return ''; }
    }
    
    function renderPeriod(period, dnf, hbw) {
        const titleClass = period === '4H' ? 'p4h' : 'p1h';
        const badge = period === '4H' ? '<span class="badge badge-main">主阵地</span>' : '<span class="badge badge-ref">参考</span>';
        const eventStart = hbw?.eventStart;
        const roundTime = formatRoundTime(eventStart, period);
        
        // DNF 信号
        let dnfSignal = '⚪ 无信号', dnfClass = 'signal-none';
        if (dnf) {
            if (dnf.trendBlocked) {
                dnfSignal = `🚫 过滤 ${dnf.originalSignal || ''}`;
                dnfClass = 'signal-blocked';
            } else if (dnf.signal) {
                const prob = (dnf.probability * 100).toFixed(0);
                dnfSignal = `${dnf.signal === 'UP' ? '🟢' : '🔴'} ${dnf.signal} ${prob}%`;
                dnfClass = dnf.signal === 'UP' ? 'signal-up' : 'signal-down';
            }
        }
        
        // DNF 指标
        let dnfMetrics = '';
        if (dnf) {
            const trendIcon = dnf.trend === 'TRENDING_UP' ? '📈' : dnf.trend === 'TRENDING_DOWN' ? '📉' : '↔️';
            const devClass = dnf.deviation >= 0 ? 'negative' : 'positive';
            const tfPct = (dnf.timeFactor * 100).toFixed(0);
            const tfColor = dnf.timeFactor > 0.7 ? '#34d399' : dnf.timeFactor > 0.4 ? '#fbbf24' : '#f87171';
            dnfMetrics = `
                <div class="metrics-grid">
                    <div class="metric-box">
                        <div class="metric-label">MA20</div>
                        <div class="metric-value">$${dnf.ma.toLocaleString('en-US', {maximumFractionDigits:0})}</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-label">偏离</div>
                        <div class="metric-value ${devClass}">${dnf.deviation >= 0 ? '+' : ''}${dnf.deviation.toFixed(2)}%</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-label">趋势</div>
                        <div class="metric-value">${trendIcon}</div>
                    </div>
                </div>
                <div class="metrics-grid" style="margin-top:8px">
                    <div class="metric-box">
                        <div class="metric-label">⏱️ 时间因子</div>
                        <div class="metric-value" style="color:${tfColor}">${tfPct}%</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-label">📊 置信度</div>
                        <div class="metric-value" style="color:#818cf8">${(dnf.probability*100).toFixed(0)}%</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-label">📏 动态阈值</div>
                        <div class="metric-value">±${dnf.dynamicThreshold.toFixed(2)}%</div>
                    </div>
                </div>
            `;
        }
        
        // HBW 内容
        let hbwContent = '';
        if (hbw) {
            // Target Price
            if (hbw.targetPrice) {
                const devClass = hbw.targetDev >= 0 ? 'negative' : 'positive';
                hbwContent += `
                    <div class="target-box">
                        <span class="target-label">🎯 Target</span>
                        <span>
                            <span class="target-value">$${hbw.targetPrice.toLocaleString('en-US', {maximumFractionDigits:2})}</span>
                            <span class="target-dev ${devClass}">${hbw.targetDev >= 0 ? '+' : ''}${hbw.targetDev.toFixed(2)}%</span>
                        </span>
                    </div>
                `;
            }
            
            // Progress or Probability Bar
            if (hbw.progress && (hbw.progress.elapsedRatio >= 0.5 || hbw.progress.ended)) {
                const elapsedPct = (hbw.progress.elapsedRatio * 100).toFixed(0);
                const remainMin = hbw.progress.remainingMin.toFixed(0);
                hbwContent += `<div class="progress-text">⏱️ 已过 ${elapsedPct}% · 剩余 ${remainMin} 分钟</div>`;
            } else {
                hbwContent += `
                    <div class="prob-bar">
                        <div class="prob-up" style="width:${hbw.pUp*100}%">UP ${(hbw.pUp*100).toFixed(0)}%</div>
                        <div class="prob-down" style="width:${hbw.pDown*100}%">DOWN ${(hbw.pDown*100).toFixed(0)}%</div>
                    </div>
                `;
            }
            
            // Prices
            hbwContent += `
                <div class="price-row">
                    <div class="price-item">
                        <div class="price-item-label">UP Price</div>
                        <div class="price-item-value">$${hbw.pUp.toFixed(3)}</div>
                    </div>
                    <div class="price-item">
                        <div class="price-item-label">DOWN Price</div>
                        <div class="price-item-value">$${hbw.pDown.toFixed(3)}</div>
                    </div>
                </div>
            `;
            
            // EV Decision
            if (hbw.action && hbw.action !== 'NO BET') {
                const evPct = (hbw.ev * 100).toFixed(1);
                const sig = hbw.action.includes('UP') ? '🟢 UP' : '🔴 DOWN';
                hbwContent += `
                    <div class="ev-box">
                        <div class="ev-positive">${sig} EV +${evPct}% · $${hbw.positionUsd}</div>
                    </div>
                `;
            } else {
                hbwContent += `
                    <div class="ev-box">
                        <div class="ev-negative">🚫 DONT BE GREEDY</div>
                    </div>
                `;
            }
        }
        
        return `
            <div class="period-card">
                <div class="period-header">
                    <div class="period-title ${titleClass}">${period} ${badge}</div>
                    ${roundTime ? `<div class="round-time">${roundTime}</div>` : ''}
                </div>
                <div class="strategy">
                    <div class="strategy-header">
                        <span class="strategy-name dnf">📊 DNF 均值回归</span>
                        <span class="signal ${dnfClass}">${dnfSignal}</span>
                    </div>
                    ${dnfMetrics}
                </div>
                <div class="strategy">
                    <div class="strategy-header">
                        <span class="strategy-name hbw">🎯 HBW 概率估算</span>
                    </div>
                    ${hbwContent}
                </div>
            </div>
        `;
    }
    
    // ===== 主逻辑 =====
    async function refresh() {
        try {
            const [klines1h, klines4h, price, poly1h, poly4h] = await Promise.all([
                fetchKlines('1h', 100),
                fetchKlines('4h', 100),
                fetchCurrentPrice(),
                fetchPolymarketData('1h'),
                fetchPolymarketData('4h')
            ]);
            
            document.getElementById('btc-price').textContent = '$' + price.toLocaleString('en-US', { maximumFractionDigits: 2 });
            document.getElementById('update-time').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN', { timeZone: 'Asia/Shanghai' });
            
            // 计算时间因子
            const tf1h = calcTimeFactor(poly1h?.eventStart, '1H');
            const tf4h = calcTimeFactor(poly4h?.eventStart, '4H');
            
            const dnf1h = analyzeDNF(klines1h, '1H', tf1h);
            const dnf4h = analyzeDNF(klines4h, '4H', tf4h);
            
            const [target1h, target4h] = await Promise.all([
                getTargetPrice(poly1h?.eventStart),
                getTargetPrice(poly4h?.eventStart)
            ]);
            
            const hbw1h = analyzeHBW(dnf1h, poly1h, target1h);
            const hbw4h = analyzeHBW(dnf4h, poly4h, target4h);
            
            document.getElementById('content').innerHTML = 
                renderPeriod('4H', dnf4h, hbw4h) +
                renderPeriod('1H', dnf1h, hbw1h);
                
        } catch (e) {
            console.error('Refresh error:', e);
            document.getElementById('content').innerHTML = '<div class="loading">❌ 数据加载失败: ' + e.message + '</div>';
        }
    }
    
    refresh();
    setInterval(refresh, 30000);
    </script>
</body>
</html>

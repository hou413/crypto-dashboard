<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>HBW 策略面板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #ffffff; 
            color: #1a1a2e; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
            padding: 24px;
            min-height: 100vh;
        }
        
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #f0f0f5;
        }
        
        .header h1 { 
            font-size: 24px; 
            font-weight: 700;
            color: #1a1a2e;
        }
        .header h1 span {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .header-info {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        
        .price-box {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
        }
        
        .update-time {
            color: #9ca3af;
            font-size: 13px;
        }
        
        .motto {
            color: #6b7280;
            font-size: 13px;
            font-style: italic;
            margin-top: 4px;
        }
        
        .periods-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .period-card {
            background: #fafafa;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 20px;
            transition: box-shadow 0.2s;
        }
        .period-card:hover {
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        
        .period-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .period-title.p4h { color: #6366f1; }
        .period-title.p1h { color: #f59e0b; }
        
        .period-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 500;
        }
        .badge-4h { background: #eef2ff; color: #6366f1; }
        .badge-1h { background: #fef3c7; color: #d97706; }
        
        /* 概率区域 */
        .probability-section {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
        }
        
        .prob-circle {
            flex: 1;
            text-align: center;
        }
        
        .prob-circle canvas {
            max-width: 120px;
            max-height: 120px;
        }
        
        .prob-label {
            font-size: 12px;
            color: #6b7280;
            margin-top: 8px;
        }
        
        /* 价格指标 */
        .price-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .metric-box {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 12px;
        }
        
        .metric-label {
            font-size: 11px;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .metric-value {
            font-size: 16px;
            font-weight: 600;
            margin-top: 4px;
            font-family: 'SF Mono', monospace;
        }
        
        .metric-sub {
            font-size: 11px;
            margin-top: 2px;
        }
        .sub-up { color: #10b981; }
        .sub-down { color: #ef4444; }
        .sub-neutral { color: #6b7280; }
        
        /* Polymarket 赔率 */
        .odds-bar {
            margin-bottom: 16px;
        }
        
        .odds-label {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 6px;
        }
        
        .odds-track {
            height: 24px;
            background: #f3f4f6;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            position: relative;
        }
        
        .odds-up {
            background: linear-gradient(90deg, #10b981, #34d399);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 11px;
            font-weight: 600;
            transition: width 0.5s ease;
        }
        
        .odds-down {
            background: linear-gradient(90deg, #f87171, #ef4444);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 11px;
            font-weight: 600;
            transition: width 0.5s ease;
        }
        
        /* 因子图表 */
        .factors-section {
            margin-bottom: 16px;
        }
        
        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 10px;
        }
        
        .factors-chart {
            height: 140px;
        }
        
        /* 决策区域 */
        .decision-box {
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }
        
        .decision-box.bet-up {
            border-color: #10b981;
            background: linear-gradient(135deg, #ecfdf5, #d1fae5);
        }
        
        .decision-box.bet-down {
            border-color: #ef4444;
            background: linear-gradient(135deg, #fef2f2, #fee2e2);
        }
        
        .decision-box.no-bet {
            border-color: #d1d5db;
            background: #f9fafb;
        }
        
        .decision-action {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .action-up { color: #10b981; }
        .action-down { color: #ef4444; }
        .action-none { color: #6b7280; }
        
        .decision-detail {
            font-size: 12px;
            color: #6b7280;
        }
        
        .ev-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 4px;
        }
        .ev-positive { background: #d1fae5; color: #059669; }
        .ev-negative { background: #fee2e2; color: #dc2626; }
        
        /* Loading */
        .loading {
            text-align: center;
            padding: 60px;
            color: #9ca3af;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e5e7eb;
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error-msg {
            text-align: center;
            padding: 40px;
            color: #ef4444;
        }
        
        @media (max-width: 900px) {
            .periods-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>🧠 <span>HBW</span> 策略面板</h1>
            <div class="motto">💡 Dont be greedy, dont be silly!</div>
        </div>
        <div class="header-info">
            <div class="price-box" id="btc-price">--</div>
            <div class="update-time" id="update-time">加载中...</div>
        </div>
    </div>
    
    <div id="content">
        <div class="loading">
            <div class="loading-spinner"></div>
            <div>加载 HBW 数据...</div>
        </div>
    </div>
    
    <script>
        const SIGNALS_FILE = '/Users/openbren/.openclaw/workspace-crypto-analyst/hbw/hbw_signals.json';
        let charts = {};
        
        async function loadData() {
            try {
                // 从 GitHub Pages 的 data.json 加载
                const resp = await fetch(`data.json?t=${Date.now()}`, {
                    cache: 'no-cache'
                });
                if (!resp.ok) throw new Error('无法加载数据');
                return await resp.json();
            } catch (e) {
                console.error('加载数据失败:', e);
                return null;
            }
        }
        
        function createProbChart(canvasId, pUp, pDown) {
            const ctx = document.getElementById(canvasId);
            if (!ctx) return;
            
            if (charts[canvasId]) {
                charts[canvasId].destroy();
            }
            
            charts[canvasId] = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['UP', 'DOWN'],
                    datasets: [{
                        data: [pUp * 100, pDown * 100],
                        backgroundColor: ['#10b981', '#ef4444'],
                        borderWidth: 0,
                        cutout: '70%'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: (ctx) => `${ctx.label}: ${ctx.parsed.toFixed(1)}%`
                            }
                        }
                    }
                }
            });
        }
        
        function createFactorsChart(canvasId, factors) {
            const ctx = document.getElementById(canvasId);
            if (!ctx) return;
            
            if (charts[canvasId]) {
                charts[canvasId].destroy();
            }
            
            const labels = [];
            const values = [];
            const colors = [];
            
            const factorNames = {
                'mean_reversion': '均值回归',
                'funding_rate': '资金费率',
                'funding_trend': '费率趋势',
                'oi_change': 'OI变化',
                'top_trader_ls': '大户多空',
                'global_ls': '全市场',
                'taker_bsv': '主动买卖'
            };
            
            for (const [key, data] of Object.entries(factors)) {
                if (data && data.lr !== undefined) {
                    labels.push(factorNames[key] || key);
                    // LR > 1 偏 UP (绿色), LR < 1 偏 DOWN (红色)
                    const lrValue = data.lr;
                    values.push(lrValue);
                    colors.push(lrValue >= 1 ? '#10b981' : '#ef4444');
                }
            }
            
            charts[canvasId] = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: colors,
                        borderRadius: 4,
                        barThickness: 16
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            min: 0.5,
                            max: 1.5,
                            grid: { color: '#f3f4f6' },
                            ticks: { 
                                callback: v => v.toFixed(2),
                                color: '#9ca3af',
                                font: { size: 10 }
                            }
                        },
                        y: {
                            grid: { display: false },
                            ticks: { 
                                color: '#374151',
                                font: { size: 11 }
                            }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: (ctx) => `LR: ${ctx.parsed.x.toFixed(3)}`
                            }
                        }
                    },
                    // 添加基准线
                }
            });
            
            // 添加 LR=1 基准线
            const chartInstance = charts[canvasId];
            const originalDraw = chartInstance.draw;
            chartInstance.draw = function() {
                originalDraw.apply(this, arguments);
                const ctx = this.ctx;
                const xScale = this.scales.x;
                const yScale = this.scales.y;
                const x = xScale.getPixelForValue(1);
                
                ctx.save();
                ctx.strokeStyle = '#9ca3af';
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(x, yScale.top);
                ctx.lineTo(x, yScale.bottom);
                ctx.stroke();
                ctx.restore();
            };
        }
        
        function renderDecision(decision, label) {
            if (!decision) return '';
            let decisionClass = 'no-bet';
            let actionClass = 'action-none';
            let actionText = '⚪ 不下注';
            
            if (decision.action && decision.action.includes('UP')) {
                decisionClass = 'bet-up';
                actionClass = 'action-up';
                actionText = '✅ BUY UP';
            } else if (decision.action && decision.action.includes('DOWN')) {
                decisionClass = 'bet-down';
                actionClass = 'action-down';
                actionText = '✅ BUY DOWN';
            }
            
            const evPercent = (decision.ev * 100) || 0;
            const evClass = evPercent > 0 ? 'ev-positive' : 'ev-negative';
            
            return `
                <div class="decision-box ${decisionClass}" style="margin-bottom: 8px;">
                    <div style="font-size: 11px; color: #6b7280; margin-bottom: 4px;">${label}</div>
                    <div class="decision-action ${actionClass}">${actionText}</div>
                    <div class="decision-detail">
                        EV: <span class="ev-badge ${evClass}">${evPercent >= 0 ? '+' : ''}${evPercent.toFixed(1)}%</span>
                        ${decision.position_usd > 0 ? ` | 仓位: $${decision.position_usd}` : ''}
                    </div>
                </div>
            `;
        }
        
        function renderPeriod(period, data, periodKey) {
            const pUp = data.p_up || 0.5;
            const pDown = data.p_down || 0.5;
            const ma20 = data.ma20;
            const ema20 = data.ema20;
            const factors = data.factors || {};
            const pmCurrent = data.polymarket_current;
            const pmNext = data.polymarket_next;
            const decCurrent = data.decision_current || {};
            const decNext = data.decision_next || {};
            
            const price = document.getElementById('btc-price').textContent.replace(/[^0-9.]/g, '');
            const currentPrice = parseFloat(price) || 0;
            
            let maDev = 0, emaDev = 0;
            if (ma20 && currentPrice) maDev = (currentPrice - ma20) / ma20 * 100;
            if (ema20 && currentPrice) emaDev = (currentPrice - ema20) / ema20 * 100;
            
            const badgeClass = periodKey === '4H' ? 'badge-4h' : 'badge-1h';
            const titleClass = periodKey === '4H' ? 'p4h' : 'p1h';
            
            return `
                <div class="period-card">
                    <div class="period-title ${titleClass}">
                        ${periodKey}
                        <span class="period-badge ${badgeClass}">${periodKey === '4H' ? '主阵地' : '参考'}</span>
                    </div>
                    
                    <div class="probability-section">
                        <div class="prob-circle">
                            <canvas id="prob-up-${periodKey}" width="120" height="120"></canvas>
                            <div class="prob-label">P(UP)</div>
                        </div>
                        <div class="prob-circle">
                            <canvas id="prob-down-${periodKey}" width="120" height="120"></canvas>
                            <div class="prob-label">P(DOWN)</div>
                        </div>
                    </div>
                    
                    <div class="price-metrics">
                        <div class="metric-box">
                            <div class="metric-label">MA20</div>
                            <div class="metric-value">${ma20 ? '$' + ma20.toLocaleString('en-US', {maximumFractionDigits: 2}) : '--'}</div>
                            <div class="metric-sub ${maDev >= 0 ? 'sub-up' : 'sub-down'}">${maDev >= 0 ? '↑' : '↓'} ${Math.abs(maDev).toFixed(2)}%</div>
                        </div>
                        <div class="metric-box">
                            <div class="metric-label">EMA20</div>
                            <div class="metric-value">${ema20 ? '$' + ema20.toLocaleString('en-US', {maximumFractionDigits: 2}) : '--'}</div>
                            <div class="metric-sub ${emaDev >= 0 ? 'sub-up' : 'sub-down'}">${emaDev >= 0 ? '↑' : '↓'} ${Math.abs(emaDev).toFixed(2)}%</div>
                        </div>
                    </div>
                    
                    ${pmCurrent ? `
                    <div class="odds-bar">
                        <div class="odds-label">📍 当前轮定价</div>
                        <div class="odds-track">
                            <div class="odds-up" style="width: ${(pmCurrent.up_price || 0.5) * 100}%">
                                UP $${(pmCurrent.up_price || 0.5).toFixed(3)}
                            </div>
                            <div class="odds-down" style="width: ${(pmCurrent.down_price || 0.5) * 100}%">
                                DOWN $${(pmCurrent.down_price || 0.5).toFixed(3)}
                            </div>
                        </div>
                    </div>
                    ` : ''}
                    
                    ${pmNext ? `
                    <div class="odds-bar">
                        <div class="odds-label">🔜 下一轮定价</div>
                        <div class="odds-track">
                            <div class="odds-up" style="width: ${(pmNext.up_price || 0.5) * 100}%">
                                UP $${(pmNext.up_price || 0.5).toFixed(3)}
                            </div>
                            <div class="odds-down" style="width: ${(pmNext.down_price || 0.5) * 100}%">
                                DOWN $${(pmNext.down_price || 0.5).toFixed(3)}
                            </div>
                        </div>
                    </div>
                    ` : ''}
                    
                    <div class="factors-section">
                        <div class="section-title">🔍 因子似然比 (LR)</div>
                        <div class="factors-chart">
                            <canvas id="factors-${periodKey}"></canvas>
                        </div>
                    </div>
                    
                    ${renderDecision(decCurrent, '📍 当前轮决策')}
                    ${renderDecision(decNext, '🔜 下一轮决策')}
                </div>
            `;
        }
        
        function render(data) {
            const content = document.getElementById('content');
            
            if (!data || !data.periods) {
                content.innerHTML = '<div class="error-msg">❌ 数据格式错误</div>';
                return;
            }
            
            // 更新头部
            if (data.price) {
                document.getElementById('btc-price').textContent = '$' + data.price.toLocaleString('en-US', {maximumFractionDigits: 2});
            }
            if (data.timestamp) {
                const t = new Date(data.timestamp);
                document.getElementById('update-time').textContent = '更新于 ' + t.toLocaleTimeString('zh-CN');
            }
            
            // 渲染两个周期
            let html = '<div class="periods-container">';
            
            if (data.periods['4H']) {
                html += renderPeriod('4H', data.periods['4H'], '4H');
            }
            if (data.periods['1H']) {
                html += renderPeriod('1H', data.periods['1H'], '1H');
            }
            
            html += '</div>';
            content.innerHTML = html;
            
            // 创建图表
            setTimeout(() => {
                ['4H', '1H'].forEach(period => {
                    const periodData = data.periods[period];
                    if (!periodData) return;
                    
                    // 概率圆环
                    createProbChart(`prob-up-${period}`, periodData.p_up || 0.5, 1 - (periodData.p_up || 0.5));
                    createProbChart(`prob-down-${period}`, 1 - (periodData.p_down || 0.5), periodData.p_down || 0.5);
                    
                    // 因子图表
                    if (periodData.factors) {
                        createFactorsChart(`factors-${period}`, periodData.factors);
                    }
                });
            }, 100);
        }
        
        async function init() {
            const data = await loadData();
            if (data) {
                render(data);
            } else {
                document.getElementById('content').innerHTML = `
                    <div class="error-msg">
                        ❌ 无法加载数据<br>
                        <small>请确保 HBW 脚本已运行并生成 hbw_signals.json</small>
                    </div>
                `;
            }
        }
        
        // 初始化
        init();
        
        // 每 30 秒刷新
        setInterval(init, 30000);
    </script>
</body>
</html>
